<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>好羊毛 · 商品机会</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="./" aria-label="好羊毛首页"><span class="brand-mark" aria-hidden="true">羊</span><strong>好羊毛</strong><span class="brand-en">haoyangmao</span></a><span class="nav-current">机会列表</span><div class="topbar-actions"><span class="bot-note">Bot 接入状态未验证</span><button id="settingsOpen" class="button subtle" type="button">设置</button></div></div></header>
<main class="app">
<section class="page-heading"><div><h1>机会列表</h1><p>Bot 提交核验结果，系统计算净利润。</p></div><div class="sync-controls"><span id="checksStatus" role="status" aria-live="polite">正在检查登录…</span><button id="refreshBtn" class="button secondary" type="button" disabled>刷新</button></div></section>
<div class="overview" aria-label="机会概览"><span>全部 <b id="countAll">—</b></span><span><i class="dot verified"></i>已核实 <b id="countVerified">—</b></span><span><i class="dot pending"></i>待确认 <b id="countPending">—</b></span><span><i class="dot expired"></i>已过期 <b id="countExpired">—</b></span></div>
<div id="workspace" class="workspace" data-detail-open="false">
<section class="list-panel" aria-label="商品机会列表">
<div class="filters"><label class="search-label"><span class="sr-only">搜索商品、规格或来源</span><input id="opportunitySearch" type="search" placeholder="搜索商品、规格或来源" autocomplete="off"></label><label><span class="sr-only">品类</span><select id="categoryFilter"><option value="all">全部品类</option><option value="phone">手机</option><option value="tablet">平板</option><option value="computer">电脑</option><option value="console">主机</option><option value="earbuds">耳机</option><option value="camera">影像</option><option value="other">其他</option></select></label><div id="statusFilters" class="status-filters" role="group" aria-label="核验状态筛选"><button type="button" data-status="all" aria-pressed="true">全部机会</button><button type="button" data-status="verified" aria-pressed="false">已核实</button><button type="button" data-status="pending" aria-pressed="false">待确认</button><button type="button" data-status="expired" aria-pressed="false">已过期</button><button type="button" data-status="voided" aria-pressed="false">已作废</button></div><label><span class="sr-only">排序</span><select id="sortOrder"><option value="profit">净利润优先</option><option value="recent">最新核验</option><option value="price">购买价从低到高</option></select></label></div>
<div class="list-columns" aria-hidden="true"><span>商品</span><span>购买价</span><span>回收价</span><span>净利润</span><span>核验状态</span></div><div id="checksList" class="opportunity-list" aria-busy="false"></div>
<div id="listState" class="list-state" role="status"><span class="empty-symbol" aria-hidden="true">◎</span><h2 id="stateTitle">正在检查登录状态</h2><p id="stateDescription">已有登录会自动恢复，无需填写凭证。</p><button id="stateAction" class="button primary" type="button" hidden>使用 GitHub 登录</button></div>
<footer class="list-footer"><span>净利润由服务端扣除运费、平台费及风险缓冲后计算</span><span id="listCount">0 条记录</span></footer></section>
<aside id="detailPanel" class="detail-panel" aria-label="核验详情"><div class="detail-head"><button id="detailBack" class="button subtle detail-back" type="button">← 返回列表</button><h2>核验详情</h2><button id="detailClose" class="icon-button" type="button" aria-label="关闭核验详情">×</button></div><div id="detailContent"><div class="detail-placeholder"><span aria-hidden="true">↗</span><h3>选择一件商品</h3><p>查看价格依据、购买条件与回收规格。</p></div></div></aside>
</div><p class="page-note">接口连接仅表示网页可以读取记录，不代表 Grok Bot 已完成接入。过期或关键条件未核实的记录不提供有效净利润。</p>
</main>
<dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle"><div class="dialog-head"><h2 id="settingsTitle">账号</h2><button id="settingsClose" class="icon-button" type="button" aria-label="关闭设置">×</button></div><p id="accountStatus" class="muted" role="status">正在检查登录…</p><div class="dialog-actions"><button id="githubLogin" class="button primary" type="button" hidden>使用 GitHub 登录</button><button id="githubLogout" class="button secondary" type="button" hidden>退出登录</button><button id="authRetry" class="button secondary" type="button" hidden>重新检查登录</button></div><p id="settingsMessage" class="settings-message" role="status" aria-live="polite"></p></dialog>
<script src="lib/deal-engine.js"></script><script src="app.js"></script>
</body></html>
